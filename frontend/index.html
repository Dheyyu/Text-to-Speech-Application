<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Text-to-Speech Application</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <header>
            <div class="logo">
                <h1>Text-to-Speech Application</h1>
            </div>

        <div class="container">

            <textarea id="text-input" placeholder="Enter text here..."></textarea>

            <div class="control">
                <select name="HH" id="voiceSelect">
                    <option value="Joanna">Joanna (Female, US)</option>
                    <option value="Matthew">Matthew (Male, US)</option>
                    <option value="Kevin">Kevin (Male, US)</option>
                    <option value="Olivia">Olivia (Female, Australian)</option>
                    <option value="Kajal">Kajal (Female, Indian)</option>
                    <option value="Amy">Amy (Female, British)</option>
                    <option value="Brian">Brian (Male, British)</option>
                    <option value="Zhiyu">Zhiyu (Female, Mandarin)</option>
                    <option value="Ayanda">Ayanda (Female, South African)</option>
                    <option value="Lea">Léa (Female, French)</option>
                    <option value="Remi">Rémi (Male, French)</option>
                    <option value="Vicki">Vicki (Female, German)</option>
                    <option value="Daniel">Daniel (Male, German)</option>
                    <option value="Bianca">Bianca (Female, Italian)</option>
                    <option value="Adriano">Adriano (Male, Italian)</option>
                    <option value="Kazuha">Kazuha (Female, Japanese)</option>
                    <option value="Takumi">Takumi (Male, Japanese)</option>
                    <option value="Seoyeon">Seoyeon (Female, Korean)</option>
                    <option value="Lupe">Lupe (Female, Spanish)</option>
                    <option value="Pedro">Pedro (Male, Spanish)</option>
                    <option value="Elin">Elin (Female, Swedish)</option>
                </select>
                
                <button id="generateBtn">Generate Audio</button>
            </div>

            <div class="loading" id="loadingIndicator">
                <p>Converting your text to speech...</p>
            </div>

            <div class="error" id="errorMessage"></div>

            <div class="audio-container" id="audioContainer">
                <audio id="audioPlayer" controls></audio>
                <button id="downloadBtn" class="download-btn">Download Audio</button>
            </div>
        </div>
        


        <script src="script.js"></script>

        <footer>
            <p>&copy; 2025 Oladayo Ayorinde 🖤 Text-to-Speech Application. All rights reserved.</p>
        </footer>
    </body>
</html>
